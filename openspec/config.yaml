# openspec/config.yaml
# Auto-generated by sdd-init on 2026-07-16 — refreshed 2026-08-06
schema: spec-driven

context: |
  Tech stack: React 19.2.7, TypeScript 6.0.2, Vite 8.1.1, Tailwind 4.3.2, Zod 4.4.3, Zustand 5.0.8
  Architecture: Clean Architecture layers (ADR-012) — domain/ → application/ → infrastructure/ → features/. Screaming Architecture + Container/Presentational + Scope Rule.
  Testing: Vitest 4.1.10 + Testing Library 16.3.2 + jsdom 29.1.1 (76 files, 773 unit) + Playwright 1.61.1 (E2E)
  Style: Screaming Architecture feature dirs, Container/Presentational, ADRs documented (12)
  Persistence: Engram + OpenSpec (hybrid)
  Features: activity-tracker, med-diet-validator, metabolic-tracker, nudge-engine, nutritional-traffic-light, recipe-engine, sustainability
  Cross-cutting: i18n ES/EN, PWA manifest, Scope Rule enforced, compositionRoot.ts for DI
  Layers: domain/ (pure TS + zod), application/ (use cases + ports), infrastructure/ (stores + adapters + storage), features/ (containers + views), shared/ (ui + i18n + hooks)
  Pre-commit: pnpm quality (format:check → lint → typecheck → test:run)

rules:
  strict_tdd: true
  proposal:
    - Include rollback plan for risky changes
    - Scope Rule: code stays in feature unless shared by 2+ features
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference ADRs when architecture decisions constrain spec
  design:
    - Include sequence diagrams for complex flows
    - Document ADR-level decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing Screaming Architecture patterns
    tdd: true
    test_command: "pnpm test:run"
  verify:
    test_command: "pnpm test:run"
    build_command: "pnpm verify"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas

testing:
  runner: vitest
  command: "pnpm test:run"
  coverage: true
  coverage_command: "pnpm test:coverage"
  layers:
    unit: true
    integration: true
    e2e: true
  quality:
    linter: oxlint (pnpm lint)
    type_checker: tsc -b --noEmit (pnpm typecheck)
    formatter: prettier
