name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality

      # PR checks (and non-develop pushes) validate the production build.
      - name: Build (verification)
        if: github.ref != 'refs/heads/develop'
        run: pnpm build

      # Staging deploy needs the /staging/ sub-path so assets resolve
      # under darkmagic76.github.io/nutre-fit-dia/staging/.
      - name: Build (staging)
        if: github.ref == 'refs/heads/develop'
        run: pnpm build
        env:
          VITE_BASE_URL: /nutre-fit-dia/staging/

      - name: Deploy staging (develop)
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: staging
          keep_files: true

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves the app through `vite preview` so the generated
      # service worker can be exercised on a cold reload with no network.
      - name: Offline cold start (service worker)
        run: pnpm test:e2e:offline
